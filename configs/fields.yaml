# ---------------------------------------------------------------------------
# RFP field extraction rules
#
# Every rule is data, not code: adding a new issuer means adding patterns here.
#
#   patterns          - regexes run against normalized block text; the named
#                       group in `group` (default: `value`) is the answer.
#   labels            - source labels (HTML grid / PDF form) mapped to the field.
#   sentence_patterns - regexes where the *whole sentence* containing the match
#                       is the answer (used for prose-y fields such as
#                       installation or payment terms).
#
# `transform` values: datetime | list | sentence | clean | title_case
# `merge` values:     precedence | union | concat | longest | most_specific
# ---------------------------------------------------------------------------

version: "1.0.0"

precedence:
  doc_types:
    master_rfp: 40
    portal_notice: 60
    vendor_spec: 25
    legal_affidavit: 20
    addendum: 100
    assignment: 0
    unknown: 10
  addendum_base: 100
  addendum_step: 10

classifier:
  doc_types: {}

normalization:
  default_timezone: "America/Chicago"
  date_input_formats:
    - "%d-%b-%Y %H:%M:%S"
    - "%m/%d/%Y %I:%M %p"
    - "%m/%d/%Y %I:%M %p %Z"
    - "%m/%d/%Y"
    - "%B %d, %Y at %I:%M %p"
    - "%B %d, %Y"
    - "%Y-%m-%d"

fields:
  # -------------------------------------------------------------------------
  - name: bid_number
    alias: "Bid Number"
    description: >-
      The issuing agency's solicitation identifier (e.g. JA-207652, BPM044557).
    kind: string
    required: true
    merge: precedence
    labels:
      - labels: ["Solicitation Number", "Bid Number", "Bid #", "Solicitation #", "RFP Number"]
        confidence: 0.97
      - labels: ["eMMA Project Number", "PORFP Number", "PORFP #"]
        confidence: 0.95
    patterns:
      - name: ariba_solicitation
        regex: '\b(?P<value>JA-\d{5,7})\b'
        confidence: 0.95
      - name: emma_project
        regex: '\b(?P<value>BPM\d{6,9})\b'
        confidence: 0.95
      - name: porfp_number
        regex: 'PORFP\s+Number\s*:?\s*#?(?P<value>E\d{2}P\d{7})'
        confidence: 0.9

  # -------------------------------------------------------------------------
  - name: title
    alias: "Title"
    description: Official solicitation title.
    kind: string
    required: true
    merge: precedence
    labels:
      - labels: ["Title"]
        confidence: 0.98
    patterns:
      - name: rfp_title_line
        regex: '(?P<value>(?:JA-\d{5,7}|BPM\d{6,9})\s+[A-Za-z0-9][A-Za-z0-9 ,/&()\-]{8,110})'
        confidence: 0.9
        max_length: 140
      - name: request_for_proposal_heading
        regex: 'Request\s+For\s+Proposal\s+\d+\s*\n?\s*(?P<value>[A-Za-z0-9][A-Za-z0-9 ,/&()\-]{8,110})'
        confidence: 0.85
        max_length: 140

  # -------------------------------------------------------------------------
  - name: due_date
    alias: "Due Date"
    description: >-
      Proposal submission deadline, resolved to ISO-8601. Addenda that extend
      the deadline override the master RFP value.
    kind: datetime
    required: true
    merge: precedence
    labels:
      - labels: ["Closing Date", "Due Date", "Solicitation Due", "PROPOSAL DUE DATE and TIME",
                 "PROPOSAL DUE DATE", "Bid Due Date", "Submission Deadline"]
        confidence: 0.95
        transform: datetime
    patterns:
      - name: addendum_new_due_date
        regex: 'new\s+due\s+date\s+for\s+this\s+RFP\s+will\s+be\s+(?P<value>[A-Z][a-z]+\s+\d{1,2},\s*\d{4}\s*(?:at)?\s*\d{1,2}:\d{2}\s*(?:AM|PM)?(?:\s*[A-Z]{2,4})?)'
        confidence: 0.99
        transform: datetime
        doc_types: ["addendum"]
      - name: addendum_extend_due_date
        regex: 'extend\s+the\s+due\s+date[^.]*?(?P<value>[A-Z][a-z]+\s+\d{1,2},\s*\d{4})'
        confidence: 0.9
        transform: datetime
        doc_types: ["addendum"]
      - name: ariba_solicitation_due
        regex: 'Solicitation\s*Due\s*(?P<value>\d{2}-[A-Z]{3}-\d{4}\s+\d{2}:\d{2}:\d{2})'
        confidence: 0.9
        transform: datetime
      - name: porfp_due_date
        regex: 'PROPOSAL\s+DUE\s+DATE\s+and\s+TIME\s*:?\s*(?:mm/dd/yyyy\s*)?(?P<value>\d{2}/\d{2}/\d{4})'
        confidence: 0.9
        transform: datetime
      - name: generic_proposal_due
        regex: '(?:proposals?|bids?|responses?)\s+(?:are\s+)?due\s+(?:on\s+or\s+before\s+|by\s+)?(?P<value>[A-Z][a-z]+\s+\d{1,2},\s*\d{4})'
        confidence: 0.7
        transform: datetime

  # -------------------------------------------------------------------------
  - name: bid_submission_type
    alias: "Bid Submission Type"
    description: How proposals must be submitted (electronic portal, sealed hard copy, etc.)
    kind: string
    merge: concat
    labels:
      - labels: ["Bid Submission Type", "Submission Type", "Method of Submission"]
        confidence: 0.9
    sentence_patterns:
      - name: electronic_system
        regex: 'submitted\s+online\s+via\s+our\s+electronic\s+system'
        confidence: 0.9
      - name: sealed_manual
        regex: 'sealed\s+envelope'
        confidence: 0.85
      - name: emma_only
        regex: 'only\s+be\s+accepted\s+through\s+the\s+State''s\s+eMaryland\s+Marketplace'
        confidence: 0.95
      - name: no_fax_email
        regex: 'No\s+fax\s+or\s+email\s+submissions\s+will\s+be\s+accepted'
        confidence: 0.8

  # -------------------------------------------------------------------------
  - name: term_of_bid
    alias: "Term of Bid"
    description: Contract length including renewal options.
    kind: string
    merge: longest
    labels:
      - labels: ["Term of Bid", "LENGTH OF CONTRACT", "Contract Term", "Initial Term"]
        confidence: 0.9
    patterns:
      - name: term_sentence
        regex: 'The\s+term\s+of\s+this\s+proposal\s+shall\s+be\s+for\s+(?P<value>a\s+three\s+\(3\)\s+year\s+agreement[^.]*\.)'
        confidence: 0.95
        max_length: 300
      - name: total_years_cap
        regex: 'may\s+be\s+extended\s+not\s+to\s+exceed\s+a\s+total\s+of\s+(?P<value>\d+\s+years?\(s\))'
        confidence: 0.8
    sentence_patterns:
      # The clause wraps across PDF line breaks, so it is captured as a sentence
      # (the extractor re-joins continuations) rather than as a single-line regex.
      - name: term_clause
        regex: 'The\s+term\s+of\s+this\s+proposal\s+shall\s+be\s+for'
        confidence: 0.97
      - name: renewal_language
        regex: 'Renewal\s+\d\s*:'
        confidence: 0.6

  # -------------------------------------------------------------------------
  - name: pre_bid_meeting
    alias: "Pre Bid Meeting"
    description: Pre-proposal / pre-bid conference date, time and venue.
    kind: datetime
    merge: precedence
    labels:
      - labels: ["Prebid Conference", "Pre-Bid Meeting", "Pre-Proposal Meeting",
                 "Pre-Proposal Conference", "Prebid Meeting"]
        confidence: 0.95
        transform: datetime
    patterns:
      - name: ariba_pre_proposal
        regex: 'Pre-?Proposal\s*Meeting\s*(?P<value>\d{2}-[A-Z]{3}-\d{4}\s+\d{2}:\d{2}:\d{2})'
        confidence: 0.9
        transform: datetime

  # -------------------------------------------------------------------------
  - name: installation
    alias: "Installation"
    description: Deployment / installation / configuration requirements.
    kind: string
    merge: longest
    sentence_patterns:
      - name: deployment_services
        regex: 'services\s+include\s+\(a\)\s+software\s+installation'
        confidence: 0.95
      - name: white_glove
        regex: 'white\s+glove\s+services'
        confidence: 0.85
      - name: autopilot_enrollment
        regex: 'autopilot\s+is\s+required'
        confidence: 0.8
      - name: asset_tagging
        regex: 'asset\s+tagging\s+and\s+etching'
        confidence: 0.75

  # -------------------------------------------------------------------------
  - name: bid_bond_requirement
    alias: "Bid Bond Requirement"
    description: Bid bond / surety requirement, if any.
    kind: string
    merge: longest
    labels:
      - labels: ["Bid Bond Requirement", "Bid Bond", "Bond Requirement"]
        confidence: 0.9
    sentence_patterns:
      - name: bond_compliance
        regex: '(?:insurance|bid\s+bond|liability)\s+requirements'
        confidence: 0.85
      - name: no_bond_required
        regex: '(?:no|not)\s+(?:bid\s+)?bond\s+(?:is\s+)?required'
        confidence: 0.9
    null_reason: "Not stated in source documents"

  # -------------------------------------------------------------------------
  - name: delivery_date
    alias: "Delivery Date"
    description: Required delivery window or lead time.
    kind: string
    merge: precedence
    labels:
      - labels: ["Delivery Date", "Delivery", "Delivery Requirement", "Due Date"]
        confidence: 0.7
    patterns:
      - name: delivery_within_days
        regex: 'Delivery\s+within\s+(?P<value>\d+\s+days\s+of\s+Award)'
        confidence: 0.95
        max_length: 120
    sentence_patterns:
      - name: anticipated_delivery
        regex: 'anticipating\s+requesting\s+quotes\s+for\s+different\s+projects'
        confidence: 0.8
      - name: ship_date
        regex: 'estimated\s+ship\s+date/lead\s+time'
        confidence: 0.75

  # -------------------------------------------------------------------------
  - name: payment_terms
    alias: "Payment Terms"
    description: Invoicing and payment conditions.
    kind: string
    merge: longest
    labels:
      - labels: ["Payment Terms", "Terms of Payment"]
        confidence: 0.9
    patterns:
      - name: net_terms
        regex: '\b(?P<value>Net\s+\d{1,3})\b'
        confidence: 0.9
    sentence_patterns:
      - name: invoice_timing
        regex: 'Invoice\(s\)\s+shall\s+be\s+submitted\s+within\s+\d+\s+days'
        confidence: 0.95
      - name: invoice_email
        regex: 'Email\s+invoices\s+to'
        confidence: 0.8
      - name: valid_days
        regex: 'valid\s+for\s+at\s+least\s+\d+\s+days\s+after\s+the\s+set\s+due\s+date'
        confidence: 0.75
      - name: pricing_valid
        regex: 'pricing\s+is\s+valid\s+for\s+thirty\s+days'
        confidence: 0.7

  # -------------------------------------------------------------------------
  - name: additional_documentation_required
    alias: "Any Additional Documentation Required"
    description: Forms and affidavits that must accompany the proposal.
    kind: string
    merge: concat
    labels:
      - labels: ["Additional Documentation Required", "Required Documentation", "Attachments"]
        confidence: 0.9
    patterns:
      # Match the exact form name.  A trailing `[^.,;]{0,60}` used to run on into
      # the quoted RFP text and captured a dangling '...states that "T'.
      - name: form_1295
        regex: '(?P<value>FORM\s*1295(?:\s*-\s*CERTIFICATE\s+OF\s+INTERESTED\s+PARTIES)?)'
        confidence: 0.9
        max_length: 90
      - name: mercury_affidavit
        regex: '(?P<value>Mercury\s+Affidavit)'
        confidence: 0.95
      - name: contract_affidavit
        regex: '(?P<value>Contract\s+Affidavit)'
        confidence: 0.9
      - name: w9
        regex: '(?P<value>W-9)'
        confidence: 0.8
      - name: mwbe_forms
        regex: '(?P<value>M/WBE\s+Compliance\s+Guidelines\s+&\s+Forms)'
        confidence: 0.85
      - name: loa
        regex: '(?P<value>Letter\s+of\s+Authorization)'
        confidence: 0.8
    sentence_patterns:
      - name: affidavit_requirement
        regex: 'must\s+provide\s+a\s+Mercury\s+Affidavit'
        confidence: 0.9
      - name: sign_submit_addendum
        regex: 'sign\s+this\s+addendum\s+and\s+submit'
        confidence: 0.7

  # -------------------------------------------------------------------------
  - name: mfg_for_registration
    alias: "MFG for Registration"
    description: Manufacturer registration requirement (portal registration, OEM status).
    kind: string
    merge: precedence
    labels:
      - labels: ["MFG for Registration", "Manufacturer Name", "Manufacturer Registration"]
        confidence: 0.9
    patterns:
      # Capture the portal name and its URL, and stop there - a loose
      # `(?:\s+\S+){0,3}` used to swallow the start of the next sentence
      # ("... This process takes").
      - name: isupplier_registration
        regex: 'register\s+with\s+the\s+(?P<value>iSupplier\s+portal\s+https?://\S+)'
        confidence: 0.95
      - name: authorized_reseller
        regex: '(?P<value>authorized\s+reseller\s+for\s+[A-Za-z]+)'
        confidence: 0.85
    sentence_patterns:
      - name: master_contractor_limited
        regex: 'LIMITED\s+TO\s+MASTER\s+CONTRACTORS'
        confidence: 0.8

  # -------------------------------------------------------------------------
  - name: contract_or_cooperative_to_use
    alias: "Contract or Cooperative to use"
    description: The umbrella contract or cooperative agreement under which the buy is made.
    kind: string
    merge: precedence
    labels:
      - labels: ["Contract or Cooperative", "Master Contract", "Cooperative Contract"]
        confidence: 0.9
    patterns:
      - name: hardware_master_contract
        regex: '(?P<value>Hardware\s+Master\s+Contract)'
        confidence: 0.95
      - name: master_contract_number
        regex: '(?P<value>060B5400007)'
        confidence: 0.7
    sentence_patterns:
      - name: desktop_laptop_tablet_contract
        regex: 'Desktop,\s*Laptop\s*and\s*Tablet\s*2015\s*Master\s*Contract'
        confidence: 0.9

  # -------------------------------------------------------------------------
  - name: model_no
    alias: "Model_no"
    description: Vendor model identifiers proposed / quoted.
    kind: list
    scope: vendor
    merge: union
    labels:
      - labels: ["Model #", "Model No", "Model Number"]
        confidence: 0.9
        transform: list
    patterns:
      - name: latitude_model
        regex: '\b(?P<value>Dell\s+Latitude\s+\d{4})\b'
        confidence: 0.95
        multiplicity: all
        transform: list
      - name: dock_model
        regex: '\b(?P<value>WD22TB4)\b'
        confidence: 0.9
        multiplicity: all
        transform: list
      - name: generic_model
        regex: '\b(?P<value>(?:OptiPlex|XPS|Precision|Latitude)\s+\d{3,5})\b'
        confidence: 0.85
        multiplicity: all
        transform: list

  # -------------------------------------------------------------------------
  - name: part_no
    alias: "Part_no"
    description: Manufacturer part numbers / SKUs.
    kind: list
    scope: vendor
    merge: union
    labels:
      - labels: ["Part No", "Part Number", "Part #", "SKU"]
        confidence: 0.85
        transform: list
    patterns:
      # Two competing hazards:
      #  1. no leading \b - PDF text layers glue the SKU to the previous word
      #     ("XCTO Base210-BLYZ"), so a word boundary silently drops most SKUs.
      #  2. phone numbers share the \d{3}-\d{4} shape ("(972)925-4100",
      #     "972-925-3700").  A value-shape guard (^\d{3}-\d{4}$) wrongly
      #     rejected real SKUs such as 362-7806, so we discriminate on context
      #     instead: a phone fragment always follows ')' or '-'.
      - name: dell_sku
        regex: '(?<![0-9)\-\.])(?P<value>\d{3}-[A-Z0-9]{4})(?![0-9A-Z\-])'
        confidence: 0.9
        multiplicity: all
        transform: list
        must_not_match: '^\d{4}-\d{2}-\d{2}$'
        doc_types: ["vendor_spec", "master_rfp", "portal_notice"]

  # -------------------------------------------------------------------------
  - name: product
    alias: "Product"
    description: The goods or services being procured.
    kind: string
    merge: precedence
    labels:
      - labels: ["Product", "Product Name", "Product Description"]
        confidence: 0.85
    patterns:
      - name: computing_devices
        regex: '(?P<value>Student\s+and\s+Staff\s+Computing\s+Devices)'
        confidence: 0.9
      - name: dell_laptops
        regex: '(?P<value>Dell\s+Laptops\s+w/?\s*Extended\s+Warranty)'
        confidence: 0.9
      - name: category_list
        regex: 'including\s+(?P<value>laptops,\s+desktops,\s+tablet\s+devices,\s+and\s+display\s+monitors)'
        confidence: 0.75

  # -------------------------------------------------------------------------
  - name: contact_info
    alias: "contact_info"
    description: "Procurement contact - name, phone, email, address."
    kind: string
    merge: concat
    labels:
      - labels: ["Agency POC Name", "Agency POC Phone Number", "Agency POC Email Address",
                 "Agency POC Mailing Address", "Contact Information", "Buyer", "Email",
                 "Procurement Officer"]
        confidence: 0.9
    patterns:
      # The TLD is an explicit alternation, not `[A-Za-z]{2,}`.  PDF text layers
      # split long addresses across lines ("...state.md" / ".us") and glue the
      # next column's text onto the fragment, producing
      # "thawkins@treasurer.state.mdAgency".  A generic TLD class happily
      # accepts "mdAgency"; requiring a real TLD rejects it.
      - name: email_address
        regex: '(?P<value>[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.(?:com|org|net|edu|gov|mil|us|uk|ca|au|de|fr|jp|in|io|co|info|biz)(?![A-Za-z0-9\-]))'
        confidence: 0.9
        multiplicity: all
        # Vendor quotes carry their own addresses (Tax_Department@dell.com);
        # contact_info means the *buyer's* contact, so vendor docs are excluded.
        doc_types: ["master_rfp", "addendum", "portal_notice", "legal_affidavit"]
      - name: phone_number
        regex: '(?P<value>\(?\d{3}\)?[\s.\-]\d{3}[\s.\-]\d{4})'
        confidence: 0.85
        multiplicity: all
        doc_types: ["master_rfp", "addendum", "portal_notice", "legal_affidavit"]
      - name: contact_person
        regex: 'Questions\s+must\s+be\s+submitted\s+in\s+writing\s+to\s+(?P<value>[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.(?:com|org|net|edu|gov|mil|us|uk|ca|au|de|fr|jp|in|io|co|info|biz)(?![A-Za-z0-9\-]))'
        confidence: 0.95
    sentence_patterns:
      - name: poc_block
        regex: 'Agency\s+POC\s+Name'
        confidence: 0.85

  # -------------------------------------------------------------------------
  - name: company_name
    alias: "company_name"
    description: Vendor / manufacturer company name (vendor-side documents only).
    kind: string
    scope: vendor
    merge: precedence
    labels:
      - labels: ["Company Name", "Vendor Name", "Supplier Name", "Manufacturer Name"]
        confidence: 0.9
    patterns:
      - name: dell_marketing_lp
        regex: '(?P<value>Dell\s+Marketing\s+LP\.?)'
        confidence: 0.95
      - name: manufacturer_dell
        regex: 'Manufacturer\s+Name\s*:?\s*(?P<value>Dell)'
        confidence: 0.85
    null_reason: "Not stated in source documents"

  # -------------------------------------------------------------------------
  - name: bid_summary
    alias: "Bid Summary"
    description: Narrative summary of what the solicitation is asking for.
    kind: string
    merge: precedence
    labels:
      - labels: ["Description", "Bid Summary", "Summary", "Business Need",
                 "Business Need / Required Functionality"]
        confidence: 0.9
    sentence_patterns:
      - name: scope_paragraph
        regex: 'is\s+soliciting\s+offers\s+for\s+the\s+goods\s+and/or\s+services'
        confidence: 0.85
      - name: specifications_include
        regex: 'Specifications\s+include,\s+but\s+are\s+not\s+limited\s+to'
        confidence: 0.9
      - name: business_need
        regex: 'Office\s+is\s+in\s+need\s+of\s+a\s+refresh\s+of\s+laptops'
        confidence: 0.9

  # -------------------------------------------------------------------------
  - name: product_specification
    alias: "Product Specification"
    description: >-
      Structured minimum requirements per device tier / line item.
      Populated by the dedicated tier extractor; see reasoning/tier_extractor.py.
    kind: dict
    merge: most_specific
    labels:
      - labels: ["Product Specification", "Specifications", "Minimum Requirements"]
        confidence: 0.8
    null_reason: "Not stated in source documents"
