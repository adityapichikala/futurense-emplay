# ---------------------------------------------------------------------------
# Hand-labelled gold set for the evaluation harness.
#
# Built by reading the source documents directly (see docs/GOLD_SET_NOTES.md).
# Each expectation is either:
#   equals:    exact normalized value
#   contains:  substring that must appear (case-insensitive)
#   min_items: minimum number of elements (list/dict fields)
#   null:      true -> the field must be reported absent
#
# Keeping the gold set in YAML means it can be reviewed and corrected without
# touching the evaluation code.
# ---------------------------------------------------------------------------

